<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A page for you · love for</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  body{ background: var(--ink); }
</style>
</head>
<body>

<div class="gift" id="gift"></div>

<div class="share-bar" id="shareBar" style="display:none">
  <input id="shareInput" readonly>
  <button class="btn btn-primary" id="copyBtn" style="padding:9px 16px;font-size:13px">Copy link</button>
  <a class="btn btn-ghost" id="makeAnotherBtn" href="index.html" style="padding:9px 16px;font-size:13px;border-color:rgba(247,240,228,.3);color:var(--parchment)">Make another</a>
</div>

<script src="assets/templates-data.js"></script>
<script src="assets/app.js"></script>
<script src="assets/view-engine.js"></script>
<script>
  const data = decodeData(hashParam());
  const gift = document.getElementById("gift");

  if (!data || !data.__t) {
    gift.innerHTML = `
      <section class="scene" style="background:#241220">
        <h2>This link isn't quite right</h2>
        <p>The page data is missing or broken. If someone sent you this,
           ask them to resend the full link — it's easy to lose the end of it when sharing.</p>
        <a href="index.html" class="btn btn-primary" style="margin-top:22px">Make your own page</a>
      </section>`;
  } else {
    const cfg = getTemplate(data.__t);
    renderGift(gift, cfg, data);

    // only show the "share this" bar to the creator, right after checkout —
    // recipients opening the link just see the page.
    if (data.__owner) {
      const bar = document.getElementById("shareBar");
      bar.style.display = "flex";
      const link = location.href;
      document.getElementById("shareInput").value = link;
      document.getElementById("copyBtn").addEventListener("click", () => {
        navigator.clipboard.writeText(link).then(() => {
          document.getElementById("copyBtn").textContent = "Copied!";
          setTimeout(() => document.getElementById("copyBtn").textContent = "Copy link", 1500);
        });
      });
    }
  }
</script>
</body>
</html>
