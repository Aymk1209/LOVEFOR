<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secure Payment · Love For</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<nav class="nav">
  <div class="wrap">
    <a href="index.html" class="brand">love <em>for</em></a>
  </div>
</nav>

<main class="flow">
  <div class="wrap">
    <div class="flow-head">
      <a href="#" class="flow-back" id="backLink">← edit details</a>
      <h1 class="flow-title">Secure UPI Payment</h1>
      <p class="flow-sub">Clicking the payment button below will open your UPI app to pay directly to your account.</p>
    </div>

    <div class="progress"><span class="done"></span><span class="done"></span><span></span></div>

    <div class="pay-summary" id="summary"></div>

    <div class="pay-options" id="options"></div>

    <div id="statusArea"></div>
  </div>
</main>

<script src="assets/templates-data.js"></script>
<script src="assets/app.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const tid = params.get("t");
  const cfg = getTemplate(tid);
  const ref = params.get("ref") || genRefId();
  const draft = JSON.parse(sessionStorage.getItem("lf_draft") || "null");

  document.getElementById("backLink").href = "create.html?t=" + tid;

  if (cfg && draft) {
    document.getElementById("summary").innerHTML = `
      <div class="tpl">${cfg.icon} ${cfg.name} — for ${escapeHtml(draft.to)}</div>
      <div class="amount">₹${cfg.price}<span> one-time</span></div>
    `;
  }

  function goToFinishedPage(){
    if (!draft) return;
    const data = Object.assign({}, draft, { __t: tid, __owner: 1 });
    sessionStorage.removeItem("lf_draft");
    location.href = "view.html#" + encodeData(data);
  }

  if (!draft) {
    document.getElementById("options").innerHTML = "";
    document.getElementById("statusArea").innerHTML =
      `<div class="status-msg wait">Your session draft has expired. <a href="create.html?t=${tid}">Start again</a>.</div>`;
  } else {
    renderOptions();
  }

  function renderOptions(){
    const upiLink = buildUpiLink({ amount: cfg.price, note: cfg.name + " for " + draft.to, refId: ref });

    let html = `
      <div class="pay-card upi" style="text-align: center; padding: 30px;">
        <h4 style="margin-bottom: 8px;">Direct UPI Payment</h4>
        <p style="margin-bottom: 20px;">Tap below to pay securely via Google Pay, PhonePe, or Paytm.</p>
        
        <div class="vpa" style="margin-bottom: 24px; background: rgba(232,69,102,0.1); color: var(--rose-deep); padding: 10px 18px; border-radius: 999px; display: inline-block; font-weight: 700; font-size: 15px;">
          ${SITE_UPI_ID} · ₹${cfg.price}
        </div>

        <a class="btn btn-primary btn-block" id="payTriggerBtn" href="${upiLink}" style="padding: 16px; font-size: 16px; font-weight: 700;">
          Open GPay / PhonePe / Paytm & Pay
        </a>

        <div style="margin-top: 24px; border-top: 1px solid var(--line); padding-top: 20px;">
          <p style="font-size: 13px; color: var(--ink-soft); margin-bottom: 14px;">
            Reference ID: <b>${ref}</b>
          </p>
          <button class="btn btn-dark btn-block" id="confirmPaymentBtn" style="background: #2E7D32; color: #fff;">
            I have completed the payment — Generate Website ✓
          </button>
        </div>
      </div>`;

    document.getElementById("options").innerHTML = html;

    // When user clicks confirm after payment completion, build and redirect to website view
    document.getElementById("confirmPaymentBtn").addEventListener("click", () => {
      document.getElementById("statusArea").innerHTML =
        `<div class="status-msg ok">Payment confirmed. Generating your personalized page link…</div>`;
      setTimeout(goToFinishedPage, 800);
    });
  }

  function escapeHtml(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
</script>
</body>
</html>
