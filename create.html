<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Make yours · Love For</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<nav class="nav">
  <div class="wrap">
    <a href="index.html" class="brand">love <em>for</em></a>
  </div>
</nav>

<main class="flow">
  <div class="wrap">
    <div class="flow-head">
      <a href="index.html" class="flow-back">← back to all pages</a>
      <h1 class="flow-title" id="flowTitle">Make yours</h1>
      <p class="flow-sub" id="flowSub"></p>
    </div>

    <div class="progress"><span class="done"></span><span></span><span></span></div>

    <form class="card-form" id="form">
      <div class="field-row">
        <div class="field">
          <label>Your name</label>
          <input type="text" name="from" required placeholder="e.g. Aarav">
        </div>
        <div class="field">
          <label>Their name</label>
          <input type="text" name="to" required placeholder="e.g. Meera">
        </div>
      </div>

      <div class="field" id="dateField" style="display:none">
        <label>Date it started <span class="hint">(for the day counter)</span></label>
        <input type="date" name="date">
      </div>

      <div class="field">
        <label>Your message <span class="hint">the letter they'll read while listening to the music</span></label>
        <textarea name="message" required placeholder="Write it like you'd say it out loud..."></textarea>
      </div>

      <div class="field">
        <label>A few short lines <span class="hint">reasons, wishes, memories — one per line, up to 5</span></label>
        <textarea name="reasons" placeholder="One reason per line"></textarea>
      </div>

      <div class="field">
        <label>Upload a photo <span class="hint">Choose a single photo from your device</span></label>
        <input type="file" id="photoFile" accept="image/*">
        <input type="hidden" name="photoUrl" id="photoUrl">
      </div>

      <div class="field">
        <label>Song link <span class="hint">Paste a YouTube track link so they can play it while reading</span></label>
        <input type="url" name="songUrl" placeholder="https://www.youtube.com/watch?v=...">
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Continue to Payment</button>
    </form>
  </div>
</main>

<script src="assets/templates-data.js"></script>
<script src="assets/app.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const tid = params.get("t") || "love-note";
  const cfg = getTemplate(tid) || TEMPLATES[0];

  document.getElementById("flowTitle").textContent = "Make yours: " + cfg.name;
  document.getElementById("flowSub").textContent = "Fill in your details, then complete the secure payment (₹" + cfg.price + ") to generate your page link instantly.";
  document.getElementById("submitBtn").textContent = "Proceed to Payment — ₹" + cfg.price;

  if (cfg.id === "anniversary") document.getElementById("dateField").style.display = "block";

  // Compress image to ensure clean URL length upon upload
  document.getElementById("photoFile").addEventListener("change", function(e) {
    const file = e.target.files[0];
    if (file) {
      compressImage(file, function(compressedDataUrl) {
        document.getElementById("photoUrl").value = compressedDataUrl;
      });
    }
  });

  document.getElementById("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const data = {
      __t: cfg.id,
      from: fd.get("from").trim(),
      to: fd.get("to").trim(),
      message: fd.get("message").trim(),
      reasons: (fd.get("reasons") || "").split("\n").map(s => s.trim()).filter(Boolean).slice(0, 5),
      photoUrl: document.getElementById("photoUrl").value.trim(),
      songUrl: (fd.get("songUrl") || "").trim(),
      date: fd.get("date") || ""
    };

    const ref = genRefId();
    sessionStorage.setItem("lf_draft", JSON.stringify(data));
    location.href = "pay.html?t=" + cfg.id + "&ref=" + ref;
  });
</script>
</body>
</html>
